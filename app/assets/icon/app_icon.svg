  <!-- Rosy cheeks -->
  <circle cx="418" cy="580" r="20" fill="#d6006c" opacity="0.35"/>
  <circle cx="606" cy="580" r="20" fill="#d6006c" opacity="0.35"/>

  <!-- Evil-eye pendant, at the collar -->
  <circle cx="512" cy="800" r="44" fill="#f3f2f2" stroke="#201e1d" stroke-width="6"/>
  <circle cx="512" cy="800" r="29" fill="#0088b0"/>
  <circle cx="512" cy="800" r="14" fill="#f3f2f2"/>
  <circle cx="512" cy="800" r="6" fill="#201e1d"/>
</svg>
