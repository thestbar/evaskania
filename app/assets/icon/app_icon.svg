<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Greek "mati" (evil-eye / nazar) charm, full-bleed like the emoji so it
       stays legible down to a 16px favicon. Concentric rings on a navy glass
       background, with a soft gloss highlight for depth. -->
  <defs>
    <radialGradient id="glass" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1c3f8f"/>
      <stop offset="55%" stop-color="#122a68"/>
      <stop offset="100%" stop-color="#0a1740"/>
    </radialGradient>
    <radialGradient id="iris" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#6fe0f7"/>
      <stop offset="45%" stop-color="#2bb6e0"/>
      <stop offset="100%" stop-color="#1489b8"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#glass)"/>

  <!-- White ring -->
  <circle cx="512" cy="512" r="340" fill="#f5f3ef"/>

  <!-- Iris -->
  <circle cx="512" cy="512" r="232" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="512" cy="512" r="96" fill="#14161c"/>

  <!-- Pupil glint -->
  <circle cx="478" cy="478" r="20" fill="#f5f3ef" opacity="0.85"/>

  <!-- Glassy sheen across the whole charm -->
  <ellipse cx="392" cy="330" rx="200" ry="120" fill="#ffffff" opacity="0.14"
           transform="rotate(-28 392 330)"/>
</svg>
